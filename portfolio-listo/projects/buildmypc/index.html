<style>
:root{color-scheme:dark;--bg:#1B0B3A;--s1:#25104D;--s2:#301A5F;--pu:#C2286B;--bl:#FAB940;--tx:#F7D9FC;--t2:#BBA3D0;--ok:#34D399;--wa:#FBBF24;--er:#F87171;--bd:#4A2F78;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--s1);position:sticky;top:0;z-index:5}
.mk{border-radius:8px;display:block}header .mk+.logo{margin-left:-12px}.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--tx),var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:var(--t2);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover,nav button:focus-visible{color:var(--tx);background:var(--s2)}nav button.on{color:var(--tx);background:var(--s2);box-shadow:inset 0 -2px var(--pu)}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}h1{font-size:30px;margin:0 0 6px}h2{margin:0 0 12px;font-size:20px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.muted{color:var(--t2)}.demo{font-size:12px;background:#5B1C2E;color:#F7D9FC;border:1px solid var(--pu);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
button.p{background:var(--bl);color:#25104D;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700}button.p:hover{filter:brightness(1.08)}button.p:active{transform:translateY(1px)}button.g:hover{border-color:var(--bl)}button.g:active{transform:translateY(1px)}
button.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
input,select{background:var(--s2);color:var(--tx);border:1px solid var(--t2);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
label{display:block;font-size:13px;color:var(--t2);margin:8px 0 3px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--t2);font-weight:600}
.st{font-weight:700}.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.ds{color:var(--t2)}
.bar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--pu),var(--bl))}.bg{background:var(--s2);border-radius:6px;margin:4px 0 10px}
.banner{background:#5B1C2E;border:1px solid var(--pu);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#F7D9FC}
.pill{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--t2)}
table{min-width:560px}.pill{font-size:13px}.banner{font-size:14px}.wa{color:var(--wa)}
@media(max-width:640px){header{position:static;padding:10px 12px}nav button{min-height:44px;padding:8px 10px}main{padding:16px 12px 50px}h1{font-size:24px}.card{padding:12px}button.p,button.g,select,input{min-height:40px}}
header{display:block}.hrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}.brand{display:flex;align-items:center;text-decoration:none}.hs{display:flex;gap:6px;flex:1 1 260px}.hs input{flex:1;min-width:0}.hb{display:flex;gap:6px;flex-wrap:wrap}header nav{margin-top:8px}
.sr{position:absolute;left:-9999px}.lead{font-size:18px;color:var(--t2);max-width:560px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center;padding:26px;border-radius:18px;margin-bottom:22px;background:radial-gradient(circle at 80% 20%,rgba(194,40,107,.45),transparent 55%),radial-gradient(circle at 10% 90%,rgba(250,185,64,.2),transparent 50%),var(--s1);border:1px solid var(--bd)}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1}.heroimg{position:relative;text-align:center}.heroimg .tw{max-width:300px}.hm{position:absolute;left:0;bottom:0}
.tw{width:100%;height:auto;display:block;margin:auto}.sec{margin:30px 0 12px}.sec h2{margin:0}
.tile{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:left;color:var(--tx);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}.tile:hover{border-color:var(--bl)}
.pc h3{margin:8px 0 2px}.pcimg{background:radial-gradient(circle,#301A5F,#1B0B3A);border-radius:10px;padding:10px;position:relative}.pcimg .pill{position:absolute;left:8px;top:8px;background:var(--s1)}.pcimg .tw{max-width:170px}
.band{border-radius:16px;padding:22px;background:linear-gradient(120deg,#5B1C2E,#25104D);border:1px solid var(--bd);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.aib{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;background:var(--bl);color:#25104D;border:0;border-radius:99px;padding:4px 16px 4px 8px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#ai{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:min(390px,calc(100vw - 24px));height:min(560px,75vh);background:var(--s1);border:1px solid var(--bl);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6)}#ai[hidden],.aib[hidden]{display:none}
.aih{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}.aih .g{margin-left:auto}.aim{flex:1;overflow:auto;padding:12px}.m{margin:0 0 10px;padding:9px 12px;border-radius:12px;max-width:92%}.m.b{background:var(--s2)}.m.u{background:#5B1C2E;margin-left:auto}.aif{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}.aif input{flex:1;min-width:0}.m .row{margin-top:8px}
details{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}textarea{background:var(--s2);color:var(--tx);border:1px solid var(--t2);border-radius:8px;padding:8px 10px;font:inherit;width:100%;min-height:70px}

const byId=id=>P.find(p=>p.id===id);const eur=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let OKS=true;try{localStorage.setItem('bmpc_t','1')}catch(e){OKS=false}
try{const x=JSON.parse(localStorage.getItem('bmpc')||'null');if(x&&typeof x.build==='object'&&!Array.isArray(x.build)){for(const[k,v]of Object.entries(x.build)){const q=byId(v);if(Object.hasOwn(CATS,k)&&q&&q.cat===k)S.build[k]=v}
if(x.shop&&typeof x.shop==='object')for(const[k,v]of Object.entries(x.shop)){const q=byId(k);if(q&&q.o.some(o=>o[0]===v))S.shop[k]=v}}if(Array.isArray(x&&x.fav))S.fav=x.fav.filter(i=>byId(i)).slice(0,100);if(Array.isArray(x&&x.tickets))S.tickets=x.tickets.filter(t=>t&&typeof t.id==='string'&&typeof t.svc==='string').slice(0,20).map(t=>({id:t.id.slice(0,20),svc:t.svc.slice(0,80),price:Number(t.price)||0,problem:String(t.problem||'').slice(0,1000),tried:String(t.tried||'').slice(0,1000),equip:String(t.equip||'').slice(0,1000),auto:String(t.auto||'').slice(0,300),date:String(t.date||'').slice(0,10),st:String(t.st||'').slice(0,80)}))}catch(e){}
const save=()=>{try{localStorage.setItem('bmpc',JSON.stringify({build:S.build,shop:S.shop,fav:S.fav,tickets:S.tickets}))}catch(e){OKS=false}};
const nm=x=>typeof x==='number'&&isFinite(x),has=a=>Array.isArray(a)&&a.length>0;
P.forEach(p=>{p.o=(Array.isArray(p.o)?p.o:[]).filter(o=>Array.isArray(o)&&typeof o[0]==='string'&&nm(o[1])&&o[1]>=0&&nm(o[2])&&o[2]>=0)});

const offer=p=>p.o.find(o=>o[0]===S.shop[p.id])||bestT(p);
function total(){const parts=Object.values(S.build).map(byId).filter(Boolean);let sub=0,nop=0;const ship={};
parts.forEach(p=>{const o=offer(p);if(!o){nop++;return}sub+=o[1];ship[o[0]]=Math.max(ship[o[0]]||0,o[2])});
const sh=Object.values(ship).reduce((a,b)=>a+b,0),r=x=>Math.round(x*100)/100;return{sub:r(sub),sh:r(sh),tot:r(sub+sh),n:parts.length,nop,stores:Object.keys(ship)}}

add('ok','CPU y placa',`Socket ${c.sock} coincide.`);
if(!has(c.mem)||!m.mem)return ds('Soporte de chipset/BIOS','faltan los tipos de memoria admitidos.');
add(c.mem.includes(m.mem)?'wa':'er','Soporte de chipset/BIOS',c.mem.includes(m.mem)?'Socket y memoria encajan, pero esta demo no incluye la lista de BIOS: verifica la versión mínima en la web del fabricante.':`El procesador no admite ${m.mem}.`)});
pair('Memoria RAM',b.ram,b.mobo,'RAM','placa',(a,m)=>{if(!a.mem||!m.mem)return ds('Memoria RAM','falta el tipo de memoria.');
if(a.mem!==m.mem)return add('er','Memoria RAM',`La RAM es ${a.mem} y la placa admite ${m.mem}.`);
if(!nm(a.gb)||!nm(m.maxRam))return ds('Memoria RAM','falta la capacidad.');
add(a.gb<=m.maxRam?'ok':'er','Memoria RAM',a.gb<=m.maxRam?`${a.mem}, ${a.gb} GB: dentro del máximo (${m.maxRam} GB).`:`Supera la capacidad máxima de la placa (${m.maxRam} GB).`)});
