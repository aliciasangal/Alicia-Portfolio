<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=https://aliciasangal.github.io/Alicia-Portfolio/" />
  <title>Alicia Sangal — Portfolio</title>
  <link rel="canonical" href="https://aliciasangal.github.io/Alicia-Portfolio/" />
  <script>
    window.location.replace('https://aliciasangal.github.io/Alicia-Portfolio/');
  </script>
  <style>
    :root { color-scheme: dark; --bg:#040607; --text:#E3D9FC; --accent:#BF40FA; --blue:#4928C2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 80% 10%,rgba(73,40,194,.28),transparent 45%),var(--bg); color:var(--text); font:16px/1.6 Inter,system-ui,-apple-system,sans-serif; }
    main { max-width:620px; text-align:center; padding:clamp(28px,6vw,56px); border:1px solid rgba(227,217,252,.18); border-radius:24px; background:rgba(10,12,17,.82); }
    .eyebrow { color:var(--accent); font-size:.78rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:.6rem 0 1rem; font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; }
    p { color:rgba(227,217,252,.78); }
    a { display:inline-block; margin-top:1rem; padding:.85rem 1.25rem; border-radius:12px; color:white; background:linear-gradient(100deg,var(--blue),var(--accent)); font-weight:750; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Portfolio · Alicia Sangal</div>
    <h1>Redirigiendo al portfolio principal</h1>
    <p>Te estamos llevando al portfolio de Alicia. Si no ocurre automáticamente, pulsa el botón.</p>
    <a href="https://aliciasangal.github.io/Alicia-Portfolio/">Entrar al portfolio ↗</a>
  </main>
</body>
</html>
