<html lang="es">
<head>

<title>Helpdesk TI · Gestión de incidencias</title>

<style>
:root{--bg:#F4F1F8;--surface:#fff;--ink:#1F1830;--muted:#61587A;--line:#DDD6E8;--soft:#EBE5F3;--accent:#6A3FC4;--accent-ink:#fff;--accent2:#C94F0A;--accent2-ink:#fff;--side-bg:#2A1A4F;--side-ink:#EDE6FA;

:root[data-theme="dark"]{--bg:#130F1C;--surface:#1D1828;--ink:#EDE9F5;--muted:#A79DC0;--line:#322B45;--soft:#261F36;--accent:#B79CFF;--accent-ink:#1A0F33;--accent2:#FF9A4D;--accent2-ink:#1F1000;--side-bg:#0E0A18;--side-ink:#EDE6FA;--crit:#FF8A80;--high:#F0A25E;--med:#E0C050;--low:#92A4AE;--pend:#E0B04D;--prog:#7FA9EE;--done:#6FCB93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
h1,h2{font-family:var(--h);margin:0;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh}
.side :focus-visible{outline-color:#fff}
.brand{font:700 20px var(--h);padding:0 10px 2px;display:flex;align-items:center;gap:9px}.brand::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--accent2)}.brand-sub{font-size:12px;opacity:.7;padding:0 10px 18px}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border:0;border-radius:8px;background:none;color:inherit;font:500 14px var(--f);cursor:pointer;text-align:left}
.nav button.on{background:rgba(255,255,255,.12)}
.badge{background:rgba(255,255,255,.18);border-radius:10px;padding:0 8px;font-size:12px}
.side .btn{margin:12px 0 0;background:var(--accent2);color:var(--accent2-ink)}
.foot{margin-top:auto;font-size:12px;opacity:.8;padding:0 10px}
.foot button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer}
main{padding:30px 34px 48px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 15px;font:600 14px var(--f);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px}
.kpi b{display:block;font:700 30px/1.1 var(--h);margin:4px 0 2px;color:var(--accent)}
.kpi span{font-size:13px;font-weight:600}.kpi small{display:block;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px}
.grid2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.grid3{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.box h2{margin-bottom:4px}.box p{margin:0 0 10px;color:var(--muted);font-size:13px}
.stack{display:grid;gap:16px;align-content:start}
.bar{display:grid;grid-template-columns:116px 1fr 30px;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.track i{display:block;height:100%;border-radius:5px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.q{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font:inherit;color:inherit;cursor:pointer}
.q .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.q small,.muted{color:var(--muted);font-size:12.5px}
.q .r{text-align:right;display:grid;justify-items:end}
.id{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.crit{color:var(--crit)}.high{color:var(--high)}.med{color:var(--med)}.low{color:var(--low)}.pend{color:var(--pend)}.prog{color:var(--prog)}.done{color:var(--done)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.in,input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:14px var(--f);width:100%}
.tools .in{width:auto}.tools .grow{flex:1 1 240px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1040px}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
td.desc{min-width:260px}td.num{text-align:right;font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:28px}
#cnt{margin:10px 2px 0;color:var(--muted);font-size:13px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}#scrim.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));z-index:30}
#drawer.on{transform:none;visibility:visible}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
textarea{min-height:66px;resize:vertical}input:disabled{opacity:.55}
.err{color:var(--crit);font-size:13px;min-height:1.3em;margin:0 0 10px}
.acts{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
svg text{fill:var(--muted);font:11px var(--f)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

@media (prefers-reduced-motion:reduce){#drawer,#toast{transition:none}}
</style>
</head>

const nf=new Intl.NumberFormat('es-ES',{maximumFractionDigits:1});
const fmtD=s=>s?new Date(s).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',',''):'—';
const hrs=t=>{if(!t.open||!t.res)return null;const h=(new Date(t.res)-new Date(t.open))/36e5;return h>=0?Math.round(h*10)/10:null};
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const SK={'Pendiente':'pend','En progreso':'prog','Resuelta':'done'},PK={'Crítica':'crit','Alta':'high','Media':'med','Baja':'low'},PO={'Crítica':0,'Alta':1,'Media':2,'Baja':3};
const pill=(k,m)=>`<span class="pill ${m[k]||''}">${esc(k)}</span>`;
const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
const lastAct=()=>new Date(tickets.reduce((m,t)=>[m,t.open,t.res].reduce((a,b)=>b>a?b:a,''),'')||Date.now());
const age=t=>{const h=(lastAct()-new Date(t.open))/36e5;return h<48?Math.max(1,Math.round(h))+' h':Math.round(h/24)+' d'};
let view='panel';const F={q:'',fs:'',fp:'',fc:'',ft:'',so:'new'};

function stats(){const n=tickets.length,c=k=>tickets.filter(t=>t.status===k).length,hs=tickets.map(hrs).filter(h=>h!==null);
return{n,pend:c('Pendiente'),prog:c('En progreso'),done:c('Resuelta'),pct:n?c('Resuelta')/n:0,avg:hs.length>=3?hs.reduce((a,b)=>a+b,0)/hs.length:null,nh:hs.length}}
function bars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([l,v,c])=>`<div class="bar"><span>${esc(l)}</span><div class="track"><i style="width:${v/mx*100}%;background:var(${c})"></i></div><b>${v}</b></div>`).join('')}
function weekly(){const m=lastAct();m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));
const ws=[...Array(12)].map((_,i)=>{const a=new Date(m);a.setDate(a.getDate()-(11-i)*7);const b=new Date(a);b.setDate(b.getDate()+7);return{a,b,reg:0,res:0}});
tickets.forEach(t=>ws.forEach(w=>{const o=new Date(t.open);if(o>=w.a&&o<w.b)w.reg++;if(t.res){const r=new Date(t.res);if(r>=w.a&&r<w.b)w.res++}}));
const mx=Math.max(1,...ws.flatMap(w=>[w.reg,w.res])),H=140;
return `<svg viewBox="0 0 600 180" width="100%" role="img" aria-label="Tickets registrados y resueltos por semana"><line x1="0" x2="600" y1="150" y2="150" stroke="var(--line)"/>`+ws.map((w,i)=>{const x=i*50+6,h1=w.reg/mx*H,h2=w.res/mx*H;
return `<rect x="${x}" y="${150-h1}" width="17" height="${h1}" rx="2" fill="var(--accent)"/><rect x="${x+19}" y="${150-h2}" width="17" height="${h2}" rx="2" fill="var(--accent2)"/><text x="${x+18}" y="168" text-anchor="middle">${String(w.a.getDate()).padStart(2,'0')}/${String(w.a.getMonth()+1).padStart(2,'0')}</text><text x="${x+8}" y="${146-h1}" text-anchor="middle">${w.reg||''}</text><text x="${x+28}" y="${146-h2}" text-anchor="middle">${w.res||''}</text>`}).join('')+`</svg><div class="legend"><span><i style="background:var(--accent)"></i>Registradas</span><span><i style="background:var(--accent2)"></i>Resueltas</span></div>`}

function panel(){const s=stats(),open=tickets.filter(t=>t.status!=='Resuelta').sort((a,b)=>PO[a.prio]-PO[b.prio]||a.open.localeCompare(b.open)),crit=open.filter(t=>t.prio==='Crítica').length;
const cnt=(k,v)=>tickets.filter(t=>t[k]===v).length;
const K=[['Total de incidencias',s.n,'Tickets registrados'],['Pendientes',s.pend,'Sin iniciar'],['En progreso',s.prog,'En diagnóstico o resolución'],['Resueltas',s.done,'Con solución aplicada'],['% de resolución',nf.format(s.pct*100)+' %',s.done+' de '+s.n+' resueltas'],['Tiempo medio de resolución',s.avg===null?'Sin datos':nf.format(s.avg)+' h','Horas naturales, '+s.nh+' tickets'],['Cumplimiento de SLA',...slaStat()]];
$('#main').innerHTML=`<div class="head"><div><h1>Panel</h1><p class="sub">Última actividad registrada: ${fmtD(lastAct())}</p></div></div>
<div class="kpis">${K.map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b><small>${k[2]}</small></div>`).join('')}</div>
<div class="grid"><section class="box"><h2>Cola de atención</h2><p>${open.length} tickets abiertos, ${crit} críticos y ${open.filter(breach).length} fuera de plazo. Ordenados por prioridad y antigüedad.</p>
${open.slice(0,8).map(t=>`<button class="q" data-id="${t.id}"><span class="id">${t.id}</span><span class="d">${esc(t.desc)}<br><small>${esc(t.dept)} · ${esc(t.tech)}</small></span><span class="r">${pill(t.prio,PK)}<small${breach(t)?' class="crit"':''}>abierto hace ${age(t)}${breach(t)?', fuera de plazo':''}</small></span></button>`).join('')}
${open.length>8?`<button class="btn ghost" style="margin-top:10px" data-view="tickets">Ver todos los tickets</button>`:''}</section>
<div class="stack"><section class="box"><h2>Por estado</h2>${bars(L.estados.map(e=>[e,cnt('status',e),'--'+SK[e]]))}</section>
<section class="box"><h2>Por prioridad</h2>${bars(['Crítica','Alta','Media','Baja'].filter(p=>L.prioridades.includes(p)).map(p=>[p,cnt('prio',p),'--'+PK[p]]))}</section></div></div>
<div class="grid grid2"><section class="box"><h2>Evolución semanal</h2><p>Últimas 12 semanas, contadas desde el lunes.</p>${weekly()}</section>
<section class="box"><h2>Por categoría</h2>${bars(L.categorias.map(c=>[c,cnt('cat',c)]).sort((a,b)=>b[1]-a[1]).map(r=>[...r,'--accent']))}</section></div>`}

function row(t){const h=hrs(t);return `<tr data-id="${t.id}"><td><button class="link" data-id="${t.id}">${t.id}</button></td><td>${fmtD(t.open)}</td><td>${esc(t.dept)}</td><td>${esc(t.user)}</td><td class="desc">${esc(t.desc)}</td><td>${esc(t.cat)}</td><td>${pill(t.prio,PK)}</td><td>${pill(t.status,SK)}</td><td>${esc(t.tech)}</td><td class="num">${h===null?'—':nf.format(h)}</td><td>${slaPill(t)}</td></tr>`}
function fill(){const q=F.q.toLowerCase();let a=tickets.filter(t=>(!F.fs||t.status===F.fs)&&(!F.fp||t.prio===F.fp)&&(!F.fc||t.cat===F.fc)&&(!F.ft||t.tech===F.ft)&&(!q||[t.id,t.user,t.equip,t.desc,t.dept].join(' ').toLowerCase().includes(q)));
const by={new:(x,y)=>y.open.localeCompare(x.open),old:(x,y)=>x.open.localeCompare(y.open),prio:(x,y)=>PO[x.prio]-PO[y.prio]||x.open.localeCompare(y.open)};a.sort(by[F.so]);
$('#rows').innerHTML=a.map(row).join('')||`<tr><td colspan="11" class="empty">Ningún ticket coincide. Cambia la búsqueda o quita algún filtro.</td></tr>`;$('#cnt').textContent=`${a.length} de ${tickets.length} tickets`}
function ticketsView(){const f=(id,all,list,v)=>`<select class="in" id="${id}" aria-label="${all}"><option value="">${all}</option>${opts(list,v)}</select>`;
$('#main').innerHTML=`<div class="head"><div><h1>Incidencias</h1><p class="sub">Selecciona un ticket para ver el diagnóstico y editarlo.</p></div><button class="btn" data-new>Nuevo ticket</button></div>
<div class="tools"><input class="in grow" id="q" type="search" placeholder="Buscar por ID, usuario, equipo o descripción" aria-label="Buscar" value="${esc(F.q)}">${f('fs','Todos los estados',L.estados,F.fs)}${f('fp','Todas las prioridades',L.prioridades,F.fp)}${f('fc','Todas las categorías',L.categorias,F.fc)}${f('ft','Todos los técnicos',L.tecnicos,F.ft)}
<select class="in" id="so" aria-label="Orden"><option value="new"${F.so==='new'?' selected':''}>Más recientes primero</option><option value="old"${F.so==='old'?' selected':''}>Más antiguos primero</option><option value="prio"${F.so==='prio'?' selected':''}>Por prioridad</option></select></div>
<div class="tablewrap"><table><thead><tr><th>ID</th><th>Apertura</th><th>Departamento</th><th>Usuario</th><th>Descripción</th><th>Categoría</th><th>Prioridad</th><th>Estado</th><th>Técnico</th><th>Horas</th><th>Plazo (SLA)</th></tr></thead><tbody id="rows"></tbody></table></div><div id="cnt"></div>`;
['q','fs','fp','fc','ft','so'].forEach(id=>$('#'+id).addEventListener('input',e=>{F[id]=e.target.value;fill()}));fill()}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));$('#nb').textContent=tickets.filter(t=>t.status!=='Resuelta').length;({panel,tickets:ticketsView,clients:clientsView,team:teamView})[view]()}

const SLA={'Crítica':4,'Alta':8,'Media':48,'Baja':120};
const breach=t=>{const h=t.res?hrs(t):(lastAct()-new Date(t.open))/36e5;return h!==null&&h>SLA[t.prio]};
const slaPill=t=>breach(t)?'<span class="pill crit">Fuera de plazo</span>':t.status==='Resuelta'?'<span class="pill done">En plazo</span>':'<span class="pill low">En curso</span>';
const slaStat=()=>{const rs=tickets.filter(t=>t.status==='Resuelta'&&hrs(t)!==null),ok=rs.filter(t=>!breach(t)).length;return rs.length?[nf.format(ok/rs.length*100)+' %',ok+' de '+rs.length+' en plazo']:['Sin datos','']};
const avgH=a=>{const h=a.map(hrs).filter(x=>x!==null);return h.length?nf.format(h.reduce((x,y)=>x+y,0)/h.length)+' h':'—'};
const FC={q:'',d:'',s:''};
function clientList(){const m={};tickets.forEach(t=>{(m[t.user]=m[t.user]||{name:t.user,dept:t.dept,ts:[]}).ts.push(t)});return Object.values(m).map(c=>({...c,open:c.ts.filter(t=>t.status!=='Resuelta').length,last:c.ts.map(t=>t.open).sort().pop(),eq:[...new Set(c.ts.map(t=>t.equip))]}))}
function fillC(){const q=FC.q.toLowerCase(),all=clientList(),a=all.filter(c=>(!FC.d||c.dept===FC.d)&&(!FC.s||(FC.s==='open'?c.open>0:c.open===0))&&(!q||(c.name+' '+c.eq.join(' ')).toLowerCase().includes(q))).sort((x,y)=>y.ts.length-x.ts.length||x.name.localeCompare(y.name));
$('#crows').innerHTML=a.map(c=>`<tr data-client="${esc(c.name)}"><td><button class="link" data-client="${esc(c.name)}">${esc(c.name)}</button></td><td>${esc(c.dept)}</td><td>${esc(c.eq.join(', '))}</td><td class="num">${c.ts.length}</td><td class="num">${c.open||'—'}</td><td>${fmtD(c.last)}</td><td class="num">${avgH(c.ts)}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">Ningún cliente coincide. Cambia la búsqueda o quita algún filtro.</td></tr>`;$('#ccnt').textContent=`${a.length} de ${all.length} clientes`}
function clientsView(){const cl=clientList(),kp=(l,v,s)=>`<div class="kpi"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
$('#main').innerHTML=`<div class="head"><div><h1>Clientes</h1><p class="sub">Personas atendidas por el servicio, actuales e históricas. Selecciona una para ver su historial.</p></div></div>
<div class="kpis">${kp('Clientes atendidos',cl.length,'Con al menos un ticket')}${kp('Con tickets abiertos',cl.filter(c=>c.open).length,'Clientes actuales')}${kp('Recurrentes',cl.filter(c=>c.ts.length>=3).length,'3 o más tickets')}${kp('Departamentos',new Set(cl.map(c=>c.dept)).size,'Con incidencias')}</div>
<div class="grid grid3"><div><div class="tools"><input class="in grow" id="cq" type="search" placeholder="Buscar por nombre o equipo" aria-label="Buscar cliente" value="${esc(FC.q)}"><select class="in" id="cd" aria-label="Departamento"><option value="">Todos los departamentos</option>${opts(L.departamentos,FC.d)}</select><select class="in" id="cs" aria-label="Situación"><option value="">Todos los clientes</option><option value="open"${FC.s==='open'?' selected':''}>Con tickets abiertos</option><option value="closed"${FC.s==='closed'?' selected':''}>Sin tickets abiertos</option></select></div>
<div class="tablewrap"><table style="min-width:720px"><thead><tr><th>Cliente</th><th>Departamento</th><th>Equipos</th><th>Tickets</th><th>Abiertos</th><th>Último ticket</th><th>Tiempo medio</th></tr></thead><tbody id="crows"></tbody></table></div><div id="ccnt" style="margin:10px 2px 0;color:var(--muted);font-size:13px"></div></div>
<section class="box"><h2>Incidencias por departamento</h2><p>Todos los tickets registrados.</p>${bars(L.departamentos.map(d=>[d,tickets.filter(t=>t.dept===d).length,'--accent']).sort((a,b)=>b[1]-a[1]))}</section></div>`;
[['cq','q'],['cd','d'],['cs','s']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{FC[k]=e.target.value;fillC()}));fillC()}
function openClient(n){const c=clientList().find(x=>x.name===n);if(!c)return;
$('#drawer').innerHTML=`<h2>${esc(c.name)}</h2><p class="sub">${esc(c.dept)}, ${c.ts.length} tickets, ${c.open} abiertos</p><div class="fg"><label>Equipos<input disabled value="${esc(c.eq.join(', '))}"></label><label>Tiempo medio de resolución<input disabled value="${avgH(c.ts)}"></label></div><h2>Historial</h2>${c.ts.slice().sort((a,b)=>b.open.localeCompare(a.open)).map(t=>`<button class="q" data-id="${t.id}"><span class="id">${t.id}</span><span class="d">${esc(t.desc)}<br><small>${fmtD(t.open)}, ${esc(t.cat)}</small></span><span class="r">${pill(t.status,SK)}${pill(t.prio,PK)}</span></button>`).join('')}<div class="acts" style="margin-top:16px"><button class="btn ghost" type="button" id="cancel">Cerrar</button></div>`;
$('#cancel').onclick=closeDrawer;$('#drawer').classList.add('on');$('#scrim').classList.add('on');$('#drawer').scrollTop=0}
function teamView(){const rows=L.tecnicos.map(n=>{const ts=tickets.filter(t=>t.tech===n),rs=ts.filter(t=>t.status==='Resuelta'),ok=rs.filter(t=>hrs(t)!==null&&!breach(t)).length;return{n,all:ts.length,op:ts.length-rs.length,rs:rs.length,avg:avgH(rs),sla:rs.length?nf.format(ok/rs.length*100)+' %':'—'}}),mx=Math.max(1,...rows.map(r=>r.op));
$('#main').innerHTML=`<div class="head"><div><h1>Equipo técnico</h1><p class="sub">Carga de trabajo y rendimiento por técnico. Selecciona uno para ver sus tickets.</p></div></div><div class="tablewrap"><table style="min-width:720px"><thead><tr><th>Técnico</th><th>Asignados</th><th>Abiertos</th><th>Carga actual</th><th>Resueltos</th><th>Tiempo medio</th><th>Cumplimiento SLA</th></tr></thead><tbody>${rows.map(r=>`<tr data-tech="${esc(r.n)}"><td><button class="link" data-tech="${esc(r.n)}">${esc(r.n)}</button></td><td class="num">${r.all}</td><td class="num">${r.op}</td><td style="min-width:140px"><div class="track"><i style="width:${r.op/mx*100}%;background:var(--accent2)"></i></div></td><td class="num">${r.rs}</td><td class="num">${r.avg}</td><td class="num">${r.sla}</td></tr>`).join('')}</tbody></table></div><p class="sub" style="margin-top:12px">Plazos objetivo (SLA): crítica 4 h, alta 8 h, media 48 h, baja 5 días. Son una referencia de la documentación del proyecto.</p>`}
function openDrawer(id){const ex=tickets.find(t=>t.id===id),nums=tickets.map(t=>+t.id.replace(/\D/g,'')),
t=ex||{id:'INC-'+String(Math.max(0,...nums)+1).padStart(3,'0'),open:nowL(),dept:'',user:'',equip:'',cat:'',desc:'',prio:'Media',status:'Pendiente',tech:'Sin asignar',diag:'',sol:'',res:'',notes:''};
const ph='<option value="">Selecciona…</option>',ta=(k,l)=>`<label class="full">${l}<textarea name="${k}">${esc(t[k])}</textarea></label>`;
$('#drawer').innerHTML=`<h2>${t.id}</h2><p class="sub">${ex?'Editando ticket':'Nuevo ticket'}</p><form id="f" novalidate><div class="fg">
<label>Fecha de apertura<input type="datetime-local" name="open" value="${t.open}"></label>
<label>Departamento<select name="dept">${ph}${opts(L.departamentos,t.dept)}</select></label>
<label>Usuario<input name="user" value="${esc(t.user)}"></label><label>Equipo afectado<input name="equip" value="${esc(t.equip)}"></label>
<label>Categoría<select name="cat">${ph}${opts(L.categorias,t.cat)}</select></label><label>Prioridad<select name="prio">${opts(L.prioridades,t.prio)}</select></label>
<label>Estado<select name="status">${opts(L.estados,t.status)}</select></label><label>Técnico asignado<select name="tech">${opts(L.tecnicos,t.tech)}</select></label>
${ta('desc','Descripción del problema')}${ta('diag','Diagnóstico técnico')}${ta('sol','Solución aplicada')}
<label>Fecha de resolución<input type="datetime-local" name="res" value="${t.res}"></label><label>Tiempo de resolución<input id="hrs" disabled></label>${ta('notes','Observaciones y seguimiento')}</div>
<p class="err" id="err" role="alert"></p><div class="acts"><button class="btn" type="submit">${ex?'Guardar cambios':'Crear ticket'}</button><button class="btn ghost" type="button" id="cancel">Cancelar</button></div></form>`;
const f=$('#f'),E=f.elements;
const sync=()=>{const d=E.status.value==='Resuelta';E.res.disabled=!d;if(d&&!E.res.value)E.res.value=nowL();if(!d)E.res.value='';const h=hrs({open:E.open.value,res:E.res.value});$('#hrs').value=h===null?'—':nf.format(h)+' h'};
E.status.addEventListener('change',sync);E.open.addEventListener('input',sync);E.res.addEventListener('input',sync);sync();
const err=m=>{$('#err').textContent=m};$('#cancel').onclick=closeDrawer;
f.onsubmit=e=>{e.preventDefault();const v={};['open','dept','user','equip','cat','desc','prio','status','tech','diag','sol','res','notes'].forEach(k=>v[k]=E[k].value.trim());
const miss=[['open','la fecha de apertura'],['dept','el departamento'],['user','el usuario'],['equip','el equipo'],['cat','la categoría'],['desc','la descripción']].filter(x=>!v[x[0]]).map(x=>x[1]),done=v.status==='Resuelta';
if(done){if(!v.res)miss.push('la fecha de resolución');if(!v.diag)miss.push('el diagnóstico');if(!v.sol)miss.push('la solución aplicada')}
if(miss.length)return err('Completa '+miss.join(', ')+'.');
if(done&&v.res<v.open)return err('La fecha de resolución no puede ser anterior a la de apertura.');
const i=tickets.findIndex(x=>x.id===t.id);if(i>=0)tickets[i]={...tickets[i],...v};else tickets.push({id:t.id,...v});
save();closeDrawer();render();toast(ex?'Cambios guardados':'Ticket creado')};
$('#drawer').classList.add('on');$('#scrim').classList.add('on');$('#drawer').scrollTop=0;(ex?E.status:E.dept).focus()}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),n=e.target.closest('[data-new]'),r=e.target.closest('[data-id]'),c=e.target.closest('[data-client]'),k=e.target.closest('[data-tech]');
if(v){view=v.dataset.view;render()}else if(n)openDrawer(null);else if(r)openDrawer(r.dataset.id);else if(c)openClient(c.dataset.client);else if(k){F.ft=k.dataset.tech;view='tickets';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#scrim').onclick=closeDrawer;
let armed=false;$('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='Confirmar restauración';setTimeout(()=>{armed=false;e.target.textContent='Restaurar datos de ejemplo'},4000);return}
armed=false;e.target.textContent='Restaurar datos de ejemplo';tickets=JSON.parse(JSON.stringify(D.tickets));save();closeDrawer();render();toast('Datos restaurados')};
render();
</script>
</body>
</html>
